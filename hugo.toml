baseURL = 'https://loadup-cloud.github.io/loadup-parent/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'LoadUp Framework'

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[[menu.main]]
  name = '文档'
  pageRef = '/docs'
  weight = 1

[[menu.main]]
  name = '搜索'
  weight = 2
  [menu.main.params]
    type = 'search'

[[menu.main]]
  name = 'GitHub'
  url = 'https://github.com/loadup-cloud/loadup-framework'
  weight = 3
  [menu.main.params]
    icon = 'github'

[params]
  description = 'LoadUp Framework：按需集成的 Spring Boot 框架与 SDK'

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.page]
    width = 'wide'

  [params.search]
    enable = true
    type = 'flexsearch'

  [params.search.flexsearch]
    js = 'js/vendor/flexsearch.bundle.min.js'

  [params.mermaid]
    js = 'js/vendor/mermaid.min.js'

[markup.goldmark.renderer]
  unsafe = true
